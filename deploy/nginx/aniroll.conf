# Per-IP limit for the backend. Generous for real use (polling, Jellyfin webhook events),
# but stops floods — e.g. random tokens that would each cost an AniList request.
limit_req_zone $binary_remote_addr zone=aniroll_api:10m rate=10r/s;

# nginx drops server-level add_header in any location that sets its own, so Cache-Control is
# chosen here and every header is set once at server level. Empty = header not sent (the
# backend sets its own caching).
# Matched on the full request with its query, first match wins. JS modules are immutable only
# with their ?v= release number (deploy.sh refuses a release with an unversioned or mixed import),
# vendor files carry their version in the path. Everything else revalidates.
map $request_uri $aniroll_cache {
    default                                         "no-cache, must-revalidate";
    ~^/(api|share|a|w)/                             "";
    ~^/js/vendor/                                   "public, max-age=31536000, immutable";
    ~^/js/[^?]+\.js\?v=\d+$                         "public, max-age=31536000, immutable";
    ~*^[^?]+\.(css|png|jpg|jpeg|gif|ico|svg|woff2?)(\?|$)  "public, max-age=31536000, immutable";
    ~*^[^?]+\.mp4(\?|$)                             "public, max-age=86400";
}

server {
    server_name old.example.com old2.example.com;

    root /var/www/aniroll;
    index index.html;

    # Ubuntu's nginx.conf compresses text/html only; CSS and JS shrink to a quarter
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/manifest+json text/vtt;

    add_header Cache-Control $aniroll_cache always;
    # The AniList token lives in localStorage; these narrow what a bug or a hostile page could do.
    # script-src 'self': only AniRoll's own files run — no inline script, no other host, no eval. A
    # hole in the escaping could then inject markup but no code that reads the token.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HTML + JS modules: always revalidate
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA manifest: Ubuntu's mime.types has no entry for .webmanifest, and it changes with the
    # app, so it gets its own type and is revalidated like the HTML
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Images, fonts, CSS with version busters: cache aggressively
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
    }

    # Shared anime links: link previews never see the part after "#", so these are
    # answered by the API, which returns Open Graph tags and redirects humans to the SPA
    location ~ ^/a/(\d+)$ {
        limit_req zone=aniroll_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001/share/anime/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /share/ {
        limit_req zone=aniroll_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The webhook secret is the whole credential and sits in the path: keep it out of the access log
    location ^~ /api/jellyfin/hook/ {
        access_log off;
        limit_req zone=aniroll_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Watch party invites: a real URL so Discord & co. show who is watching what
    location ~ ^/w/([^/]+)$ {
        limit_req zone=aniroll_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001/share/party/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Watch party live updates (Server-Sent Events): one long-lived stream per viewer, passed on
    # unbuffered. The backend pings every 25 s, well inside the read timeout.
    location ~ ^/api/party/[^/]+/\d+/events$ {
        limit_req zone=aniroll_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location /api/ {
        limit_req zone=aniroll_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/old.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/old.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = old2.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = old.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name old.example.com old2.example.com;
    return 404; # managed by Certbot
}
